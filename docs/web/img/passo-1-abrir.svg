<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img">
<style>
.bg{fill:#F6F5F1}.win{fill:#FFFFFF;stroke:#D9D6CC}.bar{fill:#ECEAE3}.t{fill:#2B2A27;font-size:15px}.s{fill:#6B6960;font-size:13px}
.box{fill:#FFFFFF;stroke:#CFCBBF}.on{fill:#FF7A1A}.knob{fill:#FFFFFF}.hl{fill:none;stroke:#FF7A1A;stroke-width:3;stroke-dasharray:6 5}
.num{fill:#0B1F3A}.numt{fill:#FFFFFF;font-size:18px;font-weight:700}.sep{stroke:#D9D6CC}
@media (prefers-color-scheme: dark){.bg{fill:#1E1D1B}.win{fill:#2A2926;stroke:#46443E}.bar{fill:#34322E}.t{fill:#EDEBE4}.s{fill:#A9A69C}.box{fill:#2A2926;stroke:#55524A}.num{fill:#FF7A1A}.sep{stroke:#46443E}}
</style>
<rect class="bg" width="800" height="360" rx="14"/>
<rect class="win" x="20" y="20" width="760" height="320" rx="10"/>
<rect class="bar" x="21" y="21" width="758" height="34" rx="9"/>
<circle cx="44" cy="38" r="6" fill="#E5534B"/><circle cx="64" cy="38" r="6" fill="#E9B949"/><circle cx="84" cy="38" r="6" fill="#57B65F"/>
<rect class="box" x="120" y="27" width="420" height="22" rx="11"/><text class="s" x="136" y="43">claude.ai</text>
<text class="s" x="560" y="43">Ilustração fictícia · Fictitious mockup</text>
<circle class="num" cx="752" cy="82" r="18"/><text class="numt" x="746" y="88">1</text>
<text class="t" x="400" y="140" text-anchor="middle" font-size="24">Nova conversa · New chat</text>
<rect class="box" x="170" y="170" width="460" height="84" rx="14"/>
<text class="s" x="190" y="200">Escreva aqui · Write here…</text>
<text class="t" x="188" y="240" font-size="22">+</text>
<circle class="on" cx="604" cy="232" r="13"/><text class="knob" x="598" y="238" font-size="16">↑</text>
<rect class="hl" x="160" y="160" width="480" height="104" rx="18"/>
</svg>
