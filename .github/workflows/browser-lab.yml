name: browser-lab

# Permanent test of the REAL panel in 11 headed browsers (fictitious project): A file:// + server,
# B file:// without server (click queue), C http, D audit of every button (tests/browser_lab/inventario.md).
# Any ❌ fails the job. AMBIENTE (the test could not run) is retried once, then only a warning.

on:
  workflow_dispatch:
  push:
    paths:
      - "painel/**"
      - "scripts/gerar_painel.py"
      - "scripts/servidor_painel.py"
      - "scripts/common.py"
      - "skills/painel/**"
      - "tests/browser_lab/**"
      - ".github/workflows/browser-lab.yml"

permissions:
  contents: read

jobs:
  lab:
    name: lab ${{ matrix.so }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            so: macos
            browsers: safari,chrome,edge,firefox,brave
          - os: windows-latest
            so: windows
            browsers: chrome,edge,firefox,brave
          - os: ubuntu-latest
            so: ubuntu
            browsers: chrome,firefox
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Selenium (+ openpyxl and pytest for the fictitious project of tests/test_pendentes.py)
        run: python -m pip install "selenium>=4.20,<5" openpyxl pytest

      - name: Safari driver + JavaScript from Apple Events (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo safaridriver --enable
          # A and B open the page from disk (safaridriver does not open file://) and drive it with AppleScript
          for domain in com.apple.Safari com.apple.Safari.SandboxBroker; do
            defaults write "$domain" IncludeDevelopMenu -bool true || true
            defaults write "$domain" AllowJavaScriptFromAppleEvents -bool true || true
            defaults write "$domain" ShowDevelopMenu -bool true || true
          done

      - name: Brave (macOS)
        id: brave_mac
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 10
        run: brew install --cask brave-browser

      - name: Brave (Windows)
        id: brave_win
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 10
        run: choco install brave -y --no-progress

      - name: Lab (macOS / Windows, headed)
        if: runner.os != 'Linux'
        env:
          BRAVE_INSTALL: ${{ steps.brave_mac.outcome }}${{ steps.brave_win.outcome }}
        run: python tests/browser_lab/run_lab.py --so ${{ matrix.so }} --browsers "${{ matrix.browsers }}" --out results

      - name: Lab (Linux, headed inside xvfb)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a -s "-screen 0 1440x900x24" \
            python tests/browser_lab/run_lab.py --so ${{ matrix.so }} --browsers "${{ matrix.browsers }}" --out results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-lab-${{ matrix.so }}
          path: results/
          if-no-files-found: warn

  resumo:
    needs: lab
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: browser-lab-*
          path: artefatos

      - name: Table
        run: |
          python tests/browser_lab/summarize.py artefatos resumo.md
          cat resumo.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: browser-lab-resumo
          path: resumo.md
