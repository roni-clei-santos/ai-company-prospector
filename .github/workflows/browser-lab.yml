name: browser-lab

# Permanent test of the REAL panel (fictitious project), opened like /painel does (gerar_painel.py):
# A file:// page, C Feito/Desfazer/report, D audit (tests/browser_lab/inventario.md), E no redraw by itself,
# F server killed with the page open, G closing the tab turns the server off.
# QUICK (every push on these paths, default): Ubuntu + Chrome, headless, under 4 minutes.
# COMPLETE (workflow_dispatch with modo=completo): 11 headed browsers on macOS, Windows and Ubuntu.
# Any ❌ fails the job. AMBIENTE (the test could not run) is retried once, then only a warning.
# If the panel does not open within 10 s, the job stops at once and prints the server output.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "rapido (Ubuntu + Chrome) ou completo (11 navegadores)"
        type: choice
        options: [rapido, completo]
        default: rapido
  push:
    paths:
      - "painel/**"
      - "scripts/gerar_painel.py"
      - "scripts/servidor_painel.py"
      - "scripts/common.py"
      - "skills/painel/**"
      - "tests/browser_lab/**"
      - ".github/workflows/browser-lab.yml"

permissions:
  contents: read

env:
  MODO: ${{ inputs.modo == 'completo' && 'completo' || 'rapido' }}

jobs:
  lab:
    name: lab ${{ matrix.so }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.modo == 'completo' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.modo == 'completo' && '{"include":[{"os":"macos-latest","so":"macos","browsers":"safari,chrome,edge,firefox,brave"},{"os":"windows-latest","so":"windows","browsers":"chrome,edge,firefox,brave"},{"os":"ubuntu-latest","so":"ubuntu","browsers":"chrome,firefox"}]}' || '{"include":[{"os":"ubuntu-latest","so":"ubuntu","browsers":"chrome"}]}') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Selenium (+ openpyxl and pytest for the fictitious project of tests/test_pendentes.py)
        run: python -m pip install "selenium>=4.20,<5" openpyxl pytest

      - name: Safari driver + JavaScript from Apple Events (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo safaridriver --enable
          # A and B open the page from disk (safaridriver does not open file://) and drive it with AppleScript
          for domain in com.apple.Safari com.apple.Safari.SandboxBroker; do
            defaults write "$domain" IncludeDevelopMenu -bool true || true
            defaults write "$domain" AllowJavaScriptFromAppleEvents -bool true || true
            defaults write "$domain" ShowDevelopMenu -bool true || true
          done

      - name: Brave (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 8
        run: brew install --cask brave-browser

      - name: Brave (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 8
        run: choco install brave -y --no-progress

      - name: Lab, quick (Ubuntu + Chrome, headless)
        if: env.MODO == 'rapido'
        run: python tests/browser_lab/run_lab.py --modo rapido --headless --so ${{ matrix.so }} --browsers "${{ matrix.browsers }}" --out results

      - name: Lab, complete (macOS / Windows, headed)
        if: env.MODO == 'completo' && runner.os != 'Linux'
        run: python tests/browser_lab/run_lab.py --modo completo --so ${{ matrix.so }} --browsers "${{ matrix.browsers }}" --out results

      - name: Lab, complete (Linux, headed inside xvfb)
        if: env.MODO == 'completo' && runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a -s "-screen 0 1440x900x24" \
            python tests/browser_lab/run_lab.py --modo completo --so ${{ matrix.so }} --browsers "${{ matrix.browsers }}" --out results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-lab-${{ matrix.so }}
          path: results/
          if-no-files-found: warn

  resumo:
    needs: lab
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: browser-lab-*
          path: artefatos

      - name: Table
        run: |
          python tests/browser_lab/summarize.py artefatos resumo.md "$MODO"
          cat resumo.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: browser-lab-resumo
          path: resumo.md
