<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sonda do laboratório</title>
<script>
  // Every step is recorded in window.__lab = {step: {ok, detalhe}}; window.__lab.fim = true at the end.
  window.__lab = {};
  window.__erros = [];
  window.onerror = function (m, s, l) { window.__erros.push(String(m) + " @" + s + ":" + l); };
  window.addEventListener("unhandledrejection", function (e) {
    window.__erros.push("rejeição: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
  });
  (function () {
    var orig = console.error;
    console.error = function () { window.__erros.push([].map.call(arguments, String).join(" ")); return orig.apply(console, arguments); };
  })();
  function marca(etapa, ok, detalhe) { window.__lab[etapa] = { ok: !!ok, detalhe: String(detalhe == null ? "" : detalhe) }; }
  function erro(e) { return (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e)); }
</script>
<script src="config.js" onerror="window.__cfgerro = 'config.js não carregou'"></script>
</head>
<body>
<h1>Sonda do laboratório</h1>
<pre id="saida">rodando...</pre>
<script>
(async function () {
  var VALOR = "[\"teste-1\"]";
  try { marca("js", true, "rodou"); } catch (e) { /* nothing else to do */ }
  try {
    marca("ambiente", true, JSON.stringify({ protocol: location.protocol, origin: location.origin,
      userAgent: navigator.userAgent, isSecureContext: window.isSecureContext }));
  } catch (e) { marca("ambiente", false, erro(e)); }

  // what was already stored BEFORE this load writes (reload / reopen check)
  try {
    var antes = localStorage.getItem("lab-fila");
    marca("inicial", antes === VALOR, antes === null ? "null" : antes);
  } catch (e) { marca("inicial", false, erro(e)); }

  try {
    if (window.LAB && LAB.url && LAB.token) marca("config", true, LAB.url);
    else marca("config", false, window.__cfgerro || "window.LAB ausente");
  } catch (e) { marca("config", false, erro(e)); }

  try {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);
    var r = await fetch(LAB.url + "/feito", { method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "X-Painel-Token": LAB.token },
      body: JSON.stringify({ id: "teste-1" }) });
    clearTimeout(timer);
    var j = null, extra = "";
    try { j = await r.json(); } catch (e) { extra = "; JSON não lido: " + erro(e); }
    marca("gravar", r.status === 200 && j && j.ok === true, "status " + r.status + extra);
  } catch (e) {
    marca("gravar", false, e && e.name === "AbortError" ? "AbortError: sem resposta em 20 s" : erro(e));
  }

  try {
    localStorage.setItem("lab-fila", VALOR);
    var v = localStorage.getItem("lab-fila");
    marca("guardar", v === VALOR, v === null ? "null" : v);
  } catch (e) { marca("guardar", false, erro(e)); }

  window.__lab.erros = window.__erros.slice();
  window.__lab.fim = true;
  document.getElementById("saida").textContent = JSON.stringify(window.__lab, null, 2);
})();
</script>
</body>
</html>
