<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t">
  <title id="t">AI Company Prospector</title>
  <style>
    .kicker { font: 700 15px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5B6B84; letter-spacing: 3px; }
    .name { font: 800 64px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0B1F3A; letter-spacing: -1.5px; }
    .name .a { fill: #F26B0F; }
    .grid { stroke: #E2E9F2; stroke-width: 1; }
    .ring { fill: none; stroke: #C9D4E3; stroke-width: 1.5; }
    .in { animation: up .8s ease-out backwards; }
    .bar { fill: #F26B0F; transform-box: fill-box; transform-origin: left; animation: grow 1.1s 1s cubic-bezier(.2,.8,.2,1) backwards; }
    .sweep { transform-origin: 1000px 150px; animation: spin 6s linear infinite; }
    .blip { fill: #FFFFFF; stroke: #C9D4E3; stroke-width: 1.5; animation: blip 6s ease-in-out infinite; }
    .ping { fill: none; stroke: #F26B0F; stroke-width: 2; transform-origin: 1000px 150px; animation: ping 3s ease-out infinite; }
    .sweep, .sweep * { transform-box: view-box; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blip { 0%, 70%, 100% { fill: #FFFFFF; stroke: #C9D4E3; } 8%, 30% { fill: #F26B0F; stroke: #F26B0F; } }
    @keyframes ping { 0% { transform: scale(.2); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" class="grid" fill="none"/></pattern>
    <radialGradient id="sw" cx="0" cy="1" r="1"><stop offset="0" stop-color="#F26B0F" stop-opacity=".45"/><stop offset="1" stop-color="#F26B0F" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="#F6F8FB"/>
    <rect width="1200" height="300" fill="url(#g)" opacity=".7"/>
    <g>
      <circle class="ring" cx="1000" cy="150" r="44"/><circle class="ring" cx="1000" cy="150" r="88"/>
      <circle class="ring" cx="1000" cy="150" r="132"/><circle class="ring" cx="1000" cy="150" r="176"/>
      <path class="ring" d="M810 150H1190M1000 -40V340" opacity=".6"/>
      <g class="sweep"><path d="M1000 150 L1000 -26 A176 176 0 0 1 1124.5 25.5 Z" fill="url(#sw)"/></g>
      <circle class="ping" cx="1000" cy="150" r="40"/>
      <rect class="blip" x="923" y="85" width="14" height="14" rx="3" style="animation-delay:0.0s"/><rect class="blip" x="1073" y="113" width="14" height="14" rx="3" style="animation-delay:1.0s"/><rect class="blip" x="1039" y="207" width="14" height="14" rx="3" style="animation-delay:2.1s"/><rect class="blip" x="941" y="189" width="14" height="14" rx="3" style="animation-delay:3.3s"/><rect class="blip" x="1105" y="171" width="14" height="14" rx="3" style="animation-delay:1.6s"/><rect class="blip" x="983" y="63" width="14" height="14" rx="3" style="animation-delay:4.4s"/>
      <circle cx="1000" cy="150" r="7" fill="#F26B0F"/>
    </g>
    <g class="in" style="animation-delay:.05s"><g transform="translate(72 84) scale(0.9583)">
    <rect width="96" height="96" rx="22" fill="#0B1F3A" stroke="#26446F" stroke-width="2"/>
    <g fill="none" stroke="#FF7A1A" stroke-linecap="round">
      <path d="M40 30 a18 18 0 0 1 18 18" stroke-width="5" opacity=".95"/>
      <path d="M40 18 a30 30 0 0 1 30 30" stroke-width="5" opacity=".6"/>
      <path d="M40 6 a42 42 0 0 1 42 42" stroke-width="5" opacity=".3"/>
    </g>
    <g class="sweep"><path d="M40 48 L40 8 A40 40 0 0 1 74 28 Z" fill="#FF7A1A" opacity=".18"/></g>
    <rect x="16" y="44" width="28" height="38" rx="3" fill="#F4F7FB"/>
    <g fill="#0B1F3A"><rect x="21" y="50" width="6" height="6" rx="1"/><rect x="33" y="50" width="6" height="6" rx="1"/>
      <rect x="21" y="61" width="6" height="6" rx="1"/><rect x="33" y="61" width="6" height="6" rx="1"/>
      <rect x="27" y="72" width="6" height="10" rx="1"/></g>
    <circle cx="40" cy="48" r="5" fill="#FF7A1A"/>
  </g></g>
    <text class="kicker in" x="188" y="112" style="animation-delay:.25s">CLAUDE CODE · OPEN SOURCE</text>
    <text class="name in" x="184" y="178" style="animation-delay:.45s">AI Company <tspan class="a">Prospector</tspan></text>
    <rect class="bar" x="188" y="204" width="220" height="6" rx="3"/>
    <defs><linearGradient id="rb" x1="0" x2="1"><stop offset="0.00" stop-color="#E40303"/><stop offset="0.20" stop-color="#FF8C00"/><stop offset="0.40" stop-color="#FFED00"/><stop offset="0.60" stop-color="#008026"/><stop offset="0.80" stop-color="#24408E"/><stop offset="1.00" stop-color="#732982"/></linearGradient></defs><rect x="0" y="294" width="1200" height="6" fill="url(#rb)" rx="0"/>
  </g>
</svg>
