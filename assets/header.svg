<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">AI Company Prospector</title>
  <desc id="d">Pare de procurar vagas. Comece a procurar empresas.</desc>
  <style>
    .bg { fill: #0B1F3A; }
    .grid { stroke: #1B375F; stroke-width: 1; }
    .name { font: 800 64px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F4F7FB; letter-spacing: -1.5px; }
    .name tspan.accent { fill: #FF7A1A; }
    .tag { font: 600 26px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #B9C6D8; }
    .tag tspan.accent { fill: #FF7A1A; }
    .kicker { font: 700 15px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8597B0; letter-spacing: 3px; }
    .dot { fill: #FF7A1A; }
    .ring { fill: none; stroke: #FF7A1A; stroke-width: 2; opacity: .6; transform-origin: 88px 76px; animation: ping 2.4s ease-out infinite; }
    .in1 { opacity: 0; animation: up .8s .1s ease-out forwards; }
    .in2 { opacity: 0; animation: up .8s .45s ease-out forwards; }
    .in3 { opacity: 0; animation: up .8s .8s ease-out forwards; }
    .bar { fill: #FF7A1A; transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .node { fill: #12294A; stroke: #26446F; stroke-width: 1.5; }
    .node.hot { fill: #FF7A1A; stroke: #FF7A1A; animation: blink 3s 1.5s ease-in-out infinite; }
    .link { stroke: #26446F; stroke-width: 1.5; stroke-dasharray: 4 5; animation: flow 1.6s linear infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(2.4); opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <defs>
    <linearGradient id="pride" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#E40303"/><stop offset=".2" stop-color="#FF8C00"/><stop offset=".4" stop-color="#FFED00"/>
      <stop offset=".6" stop-color="#008026"/><stop offset=".8" stop-color="#24408E"/><stop offset="1" stop-color="#732982"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <rect class="bg" width="1200" height="320" rx="18"/>
  <g opacity=".5">
    <line class="grid" x1="0" y1="80" x2="1200" y2="80"/><line class="grid" x1="0" y1="160" x2="1200" y2="160"/><line class="grid" x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- small network of companies on the right -->
  <g transform="translate(905 70)">
    <line class="link" x1="60" y1="40" x2="170" y2="20"/><line class="link" x1="60" y1="40" x2="140" y2="120"/>
    <line class="link" x1="170" y1="20" x2="230" y2="100"/><line class="link" x1="140" y1="120" x2="230" y2="100"/>
    <line class="link" x1="140" y1="120" x2="60" y2="170"/><line class="link" x1="230" y1="100" x2="210" y2="185"/>
    <rect class="node" x="40" y="22" width="40" height="36" rx="8"/>
    <rect class="node hot" x="150" y="2" width="40" height="36" rx="8"/>
    <rect class="node" x="120" y="102" width="40" height="36" rx="8"/>
    <rect class="node hot" x="210" y="82" width="40" height="36" rx="8"/>
    <rect class="node" x="40" y="152" width="40" height="36" rx="8"/>
    <rect class="node" x="190" y="167" width="40" height="36" rx="8"/>
  </g>

  <circle class="ring" cx="88" cy="76" r="8"/>
  <circle class="dot" cx="88" cy="76" r="6"/>
  <text class="kicker in1" x="106" y="82">CLAUDE CODE · OPEN SOURCE</text>
  <text class="name in2" x="80" y="160">AI Company <tspan class="accent">Prospector</tspan></text>
  <text class="tag in3" x="80" y="214">Pare de procurar vagas. <tspan class="accent">Comece a procurar empresas.</tspan></text>
  <rect class="bar" x="80" y="240" width="210" height="5" rx="2.5"/>
  <rect x="0" y="312" width="1200" height="8" fill="url(#pride)" clip-path="url(#card)"/>
</svg>
