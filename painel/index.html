<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da prospecção</title>
<style>
  :root { --navy: #0B1F3A; --navy-2: #12294A; --line: #26446F; --orange: #FF7A1A; --ink: #F4F7FB; --ink-2: #B9C6D8; --ink-3: #8597B0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
  .page { display: flex; flex-direction: column; min-height: 100vh; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; width: 100%; }
  main { flex: 1 0 auto; padding: 64px 0; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
  h1 { margin: 12px 0 18px; font-size: clamp(26px, 4vw, 38px); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  .card { background: var(--navy-2); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 640px; font-size: 17px; }
  code { color: var(--orange); font-weight: 700; }
  footer { padding: 18px 0 26px; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--line); }
  footer .author { margin-top: 6px; }
  footer .author a { color: var(--ink-2); }
  .pride { height: 4px; background: linear-gradient(90deg, #E40303, #FF8C00, #FFED00, #008026, #24408E, #732982); }
</style>
</head>
<body>
<div class="page">
<main class="wrap">
  <div class="brand"><span class="dot"></span> Prospecção de empresas</div>
  <h1>Painel da prospecção</h1>
  <p class="card" id="como-abrir">Este painel abre pelo comando <code>/painel</code> no Claude Code, ou sozinho no fim de cada rodada do robô.</p>
</main>
<footer>
  <div class="wrap" id="foot">Gerado por <code>scripts/gerar_painel.py</code>. A IA rascunha, você decide e envia.
    <div class="author">Feito por Roni Clei Santos · <a href="https://www.linkedin.com/in/roni-clei-santos/" target="_blank" rel="noopener">LinkedIn</a> · <a href="https://github.com/roni-clei-santos/ai-company-prospector" target="_blank" rel="noopener">GitHub</a> · <a href="https://github.com/roni-clei-santos/ai-company-prospector" target="_blank" rel="noopener">Dar uma estrela no projeto</a></div></div>
</footer>
<div class="pride" aria-hidden="true"></div>
</div>
</body>
</html>
